[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-backend"
version = "0.1.0"
description = "Spending guardrails for AI shopping agents (PayPal AI Hackathon)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "pydantic-settings",
    "requests",
    "python-dotenv",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
